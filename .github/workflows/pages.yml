name: Publish insta.studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and package the existing website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and verify the website
        run: |
          python3 scripts/build_site.py
          node --check web/app.js
          node --check web/studio.js
          node --check web/engine.js
          node --check web/instagram.js
          node --check web/apify-data.js
          node --check web/apify.js
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend
          npm run check --prefix backend
          npm run check:apify --prefix backend
          python3 -m unittest discover -s tests -v

      - name: Verify real browser navigation
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/check_navigation_browser.py

      - name: Package the original web directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Keep the downloadable offline website
        uses: actions/upload-artifact@v4
        with:
          name: insta-studio-offline
          path: |
            dist/instagram-studio.html
            dist/instagram-studio.zip
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy the checked website
        id: deployment
        uses: actions/deploy-pages@v4
